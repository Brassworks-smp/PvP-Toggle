name: Publish Mod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number for this release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew build
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ inputs.version }}
          name: '[${{ inputs.version }}] Advanced PvP Toggle'
          changelog-file: changelog.md

          loaders: neoforge
          game-versions: 1.21.1
          files: build/libs/!(*-@(dev|sources|javadoc)).jar

          modrinth-id: HmdQM9Au
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Erstellt zusätzlich ein GitHub-Release
          github-token: ${{ secrets.GITHUB_TOKEN }}
