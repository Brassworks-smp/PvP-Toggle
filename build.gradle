plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

def brassUiVersion = providers.gradleProperty('brassui_version').getOrElse('0.1.1')
def elementaVersion = providers.gradleProperty('elementa_version').getOrElse('745')
def universalCraftVersion = providers.gradleProperty('universalcraft_version').getOrElse('505')
def kotlinVersion = providers.gradleProperty('kotlin_version').getOrElse('2.0.21')
def kotlinForForgeVersion = providers.gradleProperty('kff_version').getOrElse('5.12.0')
def supportedMinecraftVersionRange = providers.gradleProperty('supported_minecraft_version_range').getOrElse('[1.21.1,1.21.2)')
def githubActor = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
def githubToken = project.findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN')

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://repo.essential.gg/repository/maven-public'
        content { includeGroup 'gg.essential' }
    }
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    if (githubActor && githubToken) {
        maven {
            url = 'https://maven.pkg.github.com/Brassworks-smp/BrassUi'
            credentials {
                username = githubActor
                password = githubToken
            }
            content { includeGroup 'net.swzo.brass' }
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    brassUiEmbed {
        canBeConsumed = false
        canBeResolved = true
    }
}

configurations.configureEach {
    exclude group: 'curse.maven', module: 'kotlin-for-forge-351264'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    def brassUi = "net.swzo.brass:brassui:${brassUiVersion}"
    def elementa = "gg.essential:elementa:${elementaVersion}"
    def universalCraft = "gg.essential:universalcraft-1.21-neoforge:${universalCraftVersion}"

    compileOnly(brassUi) { transitive = false }
    brassUiEmbed(brassUi) { transitive = false }

    compileOnly(elementa) { transitive = false }
    compileOnly(universalCraft) { transitive = false }
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"
    compileOnly "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}"

    jarJar(elementa) { transitive = false }
    jarJar(universalCraft) { transitive = false }

    runtimeOnly(brassUi) { transitive = false }
    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:${kotlinForForgeVersion}"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('jar') {
    from({ configurations.brassUiEmbed.collect { zipTree(it) } }) {
        include 'net/swzo/brass/ui/**'
        include 'assets/brassui/**'
        include 'LICENSE*'
        exclude 'net/swzo/brass/ui/neoforge/**'
        exclude 'net/swzo/brass/ui/demo/**'
    }
    from({ configurations.brassUiEmbed.collect { zipTree(it) } }) {
        include 'net/swzo/brass/ui/neoforge/NeoForgePlatform*'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            supported_minecraft_version_range: supportedMinecraftVersionRange,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
