#If true, /pvp off only protects the player from incoming PvP.
one-sided-toggle = false
#Delay in minutes until /pvp off becomes active.
# Default: 10
# Range: 0 ~ 1440
take-effect-time = 10
#If true, attacking another player while /pvp off is pending cancels the pending toggle.
cancel-pending-off-on-attack = true
#If true, players receive chat messages when PvP damage/knockback/pushing is blocked.
send-action-messages = false
#If true, PvP protection also blocks knockback-only weapons/effects.
block-knockback = true
#If true, PvP protection also prevents protected players from being physically pushed by other players.
block-player-pushing = true
